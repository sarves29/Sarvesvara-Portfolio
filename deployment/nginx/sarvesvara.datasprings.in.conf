# ================================================================
# sarvesvara.datasprings.in — portfolio
#
# Bootstrap HTTP-only config. Deploy sequence:
#   1. sudo cp this-file /etc/nginx/sites-available/sarvesvara
#   2. sudo ln -s /etc/nginx/sites-available/sarvesvara /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d sarvesvara.datasprings.in
#      (certbot adds the 443 block, HSTS, and an HTTP→HTTPS redirect)
# ================================================================

server {
    listen 80;
    server_name sarvesvara.datasprings.in;

    charset utf-8;
    client_max_body_size 20M;

    access_log /opt/Sarvesvara-Portfolio/deployment/nginx/logs/access.log;
    error_log  /opt/Sarvesvara-Portfolio/deployment/nginx/logs/error.log;

    # -----------------------------
    # Django via Gunicorn (unix socket)
    # -----------------------------
    location / {
        proxy_pass http://unix:/opt/Sarvesvara-Portfolio/deployment/gunicorn/portfolio.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120;
    }

    # -----------------------------
    # Static + media (served directly by nginx)
    # -----------------------------
    location /static/ {
        alias /opt/Sarvesvara-Portfolio/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /opt/Sarvesvara-Portfolio/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # -----------------------------
    # GZIP
    # -----------------------------
    gzip on;
    gzip_types
        text/plain application/json text/css
        application/javascript text/xml application/xml
        application/xml+rss text/javascript image/svg+xml
        application/manifest+json;
    gzip_min_length 256;

    # -----------------------------
    # Security headers (applied on HTTPS; certbot-added 443 block inherits these)
    # -----------------------------
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;
}
